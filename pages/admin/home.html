<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrador | AWSDCraft.cl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../../index.html" class="awsd-title d-flex align-items-center gap-2 mb-4 text-decoration-none">
        <i class="bi bi-keyboard fs-4"></i>
        <span>AWSDCraft<span class="text-awsd-accent">.cl</span></span>
      </a>
      <nav>
        <a href="home.html" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="productos-listado.html"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="usuarios-listado.html"><i class="bi bi-people"></i> Usuarios</a>
      </nav>
    </aside>

    <div class="admin-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="awsd-title h3 mb-0">¡Hola, Administrador!</h1>
        <a href="../../index.html" class="btn btn-outline-awsd btn-sm">
          <i class="bi bi-box-arrow-left me-1"></i>Volver a la tienda
        </a>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="admin-stat-card">
            <p class="text-secondary small mb-1">Total productos</p>
            <p class="stat-numero mb-0" id="statTotalProductos">-</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="admin-stat-card">
            <p class="text-secondary small mb-1">Total usuarios</p>
            <p class="stat-numero mb-0" id="statTotalUsuarios">-</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="admin-stat-card">
            <p class="text-secondary small mb-1">Con stock crítico</p>
            <p class="stat-numero mb-0" id="statStockCritico">-</p>
          </div>
        </div>
      </div>

      <div class="admin-stat-card">
        <h2 class="h6 mb-3">Productos con stock crítico</h2>
        <div id="listaStockCritico">
          <p class="text-secondary small">Cargando...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/productos-data.js"></script>
  <script src="../../js/usuarios-data.js"></script>
  <script src="../../js/admin-datos.js"></script>
  <script src="../../js/admin-home.js"></script>
</body>
</html>
